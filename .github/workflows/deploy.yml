name: Checks

on:
  push:
    branches: [claude/csun-class-scraper-wwi504]
  pull_request:
    branches: [claude/csun-class-scraper-wwi504]

jobs:
  web:
    name: Type check and web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Confirm the committed bundle matches the source
        run: |
          npm run build
          git diff --exit-code public/app.js

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: pytest
