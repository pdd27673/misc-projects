name: MockCoach
options:
  bundleIdPrefix: com.mockcoach
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID here
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MockCoach:
    type: application
    platform: macOS
    sources:
      # Exclude the hand-written Info.plist and entitlements from the build
      # phases — they're wired via the build settings below, not bundled as
      # resources. (Intentionally no `info:` block: that makes XcodeGen generate
      # a plist and overwrite the hand-written one that carries the usage
      # descriptions.)
      - path: MockCoach
        excludes:
          - "Support/Info.plist"
          - "Support/MockCoach.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mockcoach.MockCoach
        INFOPLIST_FILE: MockCoach/Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: MockCoach/Support/MockCoach.entitlements
        LSUIElement: YES # menubar-only agent app (no Dock icon)
        COMBINE_HIDPI_IMAGES: YES
